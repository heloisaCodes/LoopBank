<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transferência | LoopBank</title>
</head>
<body>

    <h1>Realizar transferência</h1>
    <p>Informe os dados da conta que receberá o dinheiro</p>

    <form>
        <label for="conta_destino">Número da conta de destino:</label>
        <input type="text" id="conta_destino"
               name="conta_destino" required>

        <label for="valor">Valor da transferência:</label>
        <input type="number" id="valor" name="valor"
               min="0.01" step="0.01" required>

        <button type="submit">Transferir</button>
    </form>

    <a href="javascript:history.back()">Voltar</a>

</body>
</html>
