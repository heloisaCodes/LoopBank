<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
:root{--roxo:#5b2fd6;--roxo-escuro:#3b1fa8;--titulo:#2d1b9a;--texto:#4b3fa0;--suave:#8374c9;--borda:#ddd5f7;--rosa:#fbeaf8;--rosa-texto:#b0269f}
*{box-sizing:border-box;margin:0}
body{position:relative;overflow-x:hidden;font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:var(--texto);background:linear-gradient(180deg,#fcfbff 0%,#f3eeff 100%);min-height:100vh;display:flex;flex-direction:column;line-height:1.5}
body::before,body::after{content:"";position:fixed;bottom:-70px;width:420px;height:230px;background:#e9e1ff;opacity:.75;z-index:-1}
body::before{left:-140px;border-radius:0 70% 0 0}
body::after{right:-140px;border-radius:70% 0 0 0}
a{color:var(--roxo);text-decoration:none}
:focus-visible{outline:3px solid #a78bfa;outline-offset:2px}
.container{width:100%;max-width:1100px;margin:0 auto;padding:0 24px}
.topo{background:#fff;border-bottom:1px solid #f0ebff}
.barra{display:flex;justify-content:space-between;align-items:center;height:68px}
.logo{display:flex;align-items:center;gap:8px;font-weight:700;font-size:1.3rem;color:var(--titulo)}
.logo svg{width:30px;height:30px}
.nav{display:flex;align-items:center;gap:26px;font-size:.82rem;font-weight:600}
.voltar{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;font-weight:500}
.voltar svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.botao{display:inline-block;padding:12px 30px;border-radius:7px;border:1.5px solid var(--roxo);background:var(--roxo);color:#fff;font-family:inherit;font-size:.85rem;font-weight:600;cursor:pointer;text-align:center}
.botao:hover{background:var(--roxo-escuro)}
.botao.contorno{background:#fff;color:var(--roxo)}
.botao.contorno:hover{background:#f1ecff}
.botao.pequeno{padding:8px 18px;font-size:.8rem}
.selo{display:inline-block;padding:3px 12px;border:1.5px solid var(--roxo);border-radius:99px;background:#fff;color:var(--titulo);font-size:.66rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase}
h1{color:var(--titulo);font-size:clamp(2.2rem,5vw,3.1rem);line-height:1.08;margin:16px 0 14px}
.hero{display:grid;grid-template-columns:1fr 1fr;align-items:center;gap:24px;padding-top:36px;padding-bottom:28px}
.hero p{font-size:1.05rem;max-width:30ch}
.acoes{display:flex;gap:16px;flex-wrap:wrap;margin-top:26px}
.hero-arte svg{display:block;width:100%;height:auto;max-height:380px}
.recursos{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:56px}
.recurso{display:flex;align-items:center;gap:16px;padding:22px;background:rgba(255,255,255,.65);border:1px solid #ebe5ff;border-radius:8px}
.circulo{flex:none;width:48px;height:48px;border-radius:50%;background:#efeaff;display:grid;place-items:center;color:var(--roxo)}
.circulo svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.recurso h3{color:var(--titulo);font-size:.95rem}
.recurso p{font-size:.82rem;color:var(--suave)}
.rodape{margin-top:auto;background:#fff;border-top:1px solid #f0ebff;font-size:.72rem;color:var(--suave)}
.rodape .container{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;min-height:52px}
.rodape nav{display:flex}
.rodape nav a+a{border-left:1px solid var(--borda);margin-left:16px;padding-left:16px}
.auth{flex:1;display:grid;grid-template-columns:1fr 1fr;align-items:start;gap:48px;padding-top:44px;padding-bottom:56px}
.auth h1{font-size:clamp(1.9rem,4vw,2.3rem);margin:14px 0 8px}
.auth .texto p{font-size:.88rem}
.ilustracao{margin-top:24px;max-width:340px}
.ilustracao svg{display:block;width:100%;height:auto}
.coluna{max-width:470px;width:100%;justify-self:end}
.cartao{background:#fff;border:1px solid var(--borda);border-radius:12px;padding:24px}
.coluna .voltar{margin-top:20px}
.aviso{display:flex;align-items:center;gap:8px;padding:12px 14px;margin-bottom:18px;border-radius:6px;background:var(--rosa);color:var(--rosa-texto);font-size:.78rem}
.aviso svg{width:15px;height:15px;flex:none;fill:none;stroke:currentColor;stroke-width:2}
label{display:block;margin:0 0 6px;color:var(--titulo);font-size:.78rem;font-weight:700}
.campo{position:relative;margin-bottom:16px}
.campo>svg{position:absolute;left:12px;top:50%;width:15px;height:15px;transform:translateY(-50%);fill:none;stroke:var(--suave);stroke-width:2;pointer-events:none}
.campo input{width:100%;height:42px;padding:0 40px;border:1px solid var(--borda);border-radius:6px;font-family:inherit;font-size:.8rem;color:var(--titulo);background:#fff}
.campo input::placeholder{color:#a99fd6}
.campo input:focus{outline:none;border-color:var(--roxo);box-shadow:0 0 0 3px #e4dcff}
.olho{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:32px;height:32px;border:0;background:none;color:var(--suave);cursor:pointer}
.olho svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2}
.olho .fechado,.olho[aria-pressed="true"] .aberto{display:none}
.olho[aria-pressed="true"] .fechado{display:inline}
.cartao .botao{width:100%;margin-top:4px;padding:11px}
.troca{text-align:center;font-size:.78rem;margin-top:18px}
.troca a{text-decoration:underline}
@media(max-width:820px){.hero,.auth{grid-template-columns:1fr}.hero-arte{order:-1}.recursos{grid-template-columns:1fr}.auth{gap:28px}.coluna{justify-self:center}.ilustracao{max-width:260px}}
</style>
  <title>Criar conta | LoopBank</title>
</head>
<body>
  {% set aviso = mensagem or request.args.get('mensagem') %}
  <header class="topo"><div class="container barra">
    <a class="logo" href="{{ url_for('inicio') }}"><svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="16" fill="#3b1fa8"/><path d="M16 7.5a8.5 8.5 0 1 0 8.5 8.5" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round"/><circle cx="21.5" cy="10.5" r="2.4" fill="#a78bfa"/></svg> LoopBank</a>
    <a class="voltar" href="{{ url_for('inicio') }}"><svg width="16" height="16" viewBox="0 0 24 24"><path d="M19 12H5M11 6l-6 6 6 6"/></svg> Voltar para o início</a>
  </div></header>

  <main class="auth container">
    <section class="texto">
      <span class="selo">Vamos começar?</span>
      <h1>Abra sua conta</h1>
      <p>Preencha os dados abaixo para começar.</p>
      <div class="ilustracao"><svg viewBox="0 0 330 200" aria-hidden="true"><defs><symbol id="b" viewBox="-12 -12 24 24"><path d="M0-12Q0 0 12 0Q0 0 0 12Q0 0-12 0Q0 0 0-12Z"/></symbol></defs>
<ellipse cx="165" cy="125" rx="130" ry="62" fill="#ece6ff"/>
<g transform="rotate(-6 150 100)"><rect x="85" y="25" width="130" height="150" rx="10" fill="#f6f2ff" stroke="#c9b8ff" stroke-width="3"/><rect x="100" y="45" width="30" height="24" rx="4" fill="#d8ccff"/><rect x="100" y="85" width="60" height="6" rx="3" fill="#c9b8ff"/><rect x="100" y="100" width="90" height="6" rx="3" fill="#d8ccff"/><rect x="100" y="115" width="75" height="6" rx="3" fill="#d8ccff"/></g>
<circle cx="205" cy="68" r="25" fill="#5b2fd6"/><circle cx="205" cy="61" r="8" fill="#fff"/><path d="M191 85a14 12 0 0 1 28 0z" fill="#fff"/>
<circle cx="210" cy="142" r="22" fill="#7c5cf0"/><path d="M200 142l7 7 13-14" stroke="#fff" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M240 70q26-6 20 18q-5 14-22 8" fill="none" stroke="#5b2fd6" stroke-width="2" stroke-linecap="round"/><path d="M52 168q-14-12 4-22" fill="none" stroke="#5b2fd6" stroke-width="2" stroke-linecap="round"/>
<use href="#b" x="40" y="100" width="18" height="18" fill="#7c5cf0"/><use href="#b" x="255" y="30" width="16" height="16" fill="#a78bfa"/><use href="#b" x="270" y="120" width="12" height="12" fill="#c9b8ff"/></svg></div>
    </section>

    <div class="coluna">
      <form class="cartao" method="post" action="{{ url_for('cadastroCliente') }}">
        {% if aviso %}<div class="aviso" role="alert"><svg width="16" height="16" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg><span>{{ aviso }}</span></div>{% endif %}
        <label for="nome">Nome completo</label>
        <div class="campo"><svg width="16" height="16" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>
          <input id="nome" name="nome" type="text" autocomplete="name" placeholder="Digite seu nome completo" value="{{ request.form.get('nome') or '' }}" required>
        </div>
        <label for="cpf">CPF</label>
        <div class="campo"><svg width="16" height="16" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>
          <input id="cpf" name="cpf" type="text" inputmode="numeric" maxlength="11" data-cpf placeholder="Digite seu CPF" value="{{ request.form.get('cpf') or '' }}" required>
        </div>
        <label for="senha">Senha</label>
        <div class="campo"><svg width="16" height="16" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
          <input id="senha" name="senha" type="password" autocomplete="new-password" placeholder="Crie sua senha" required>
          <button type="button" class="olho" data-alvo="senha" aria-label="Mostrar ou ocultar senha" aria-pressed="false"><svg class="aberto" viewBox="0 0 24 24"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg><svg class="fechado" viewBox="0 0 24 24"><path d="M3 3l18 18M10.6 5.1A9.7 9.7 0 0 1 12 5c6 0 10 7 10 7a17 17 0 0 1-3.2 4M6.5 6.6C3.8 8.4 2 12 2 12s4 7 10 7c1.6 0 3-.4 4.3-1"/></svg></button>
        </div>
        <label for="tipo">Tipo de conta</label>
        <div class="campo">
          <select id="tipo" name="tipo" style="width: 100%; height: 42px; padding: 0 12px; border: 1px solid var(--borda); border-radius: 6px; font-family: inherit; font-size: .8rem; color: var(--titulo); background: #fff;" required>
            <option value="" disabled selected>Selecione o tipo de conta</option>
            <option value="corrente">Conta Corrente</option>
            <option value="poupança">Conta Poupança</option>
            <option value="salario">Conta Salário</option>
          </select>
        </div>
        <button class="botao" type="submit">Criar minha conta</button>
        <p class="troca">Já tem uma conta? <a href="{{ url_for('entrarConta') }}">Faça login</a></p>
      </form>
    </div>
  </main>

  <footer class="rodape"><div class="container"><span>LoopBank © 2026. Todos os direitos reservados.</span></div></footer>
  <script>
document.querySelectorAll('.olho').forEach(function (btn) {
  btn.addEventListener('click', function () {
    var input = document.getElementById(btn.dataset.alvo);
    var mostrar = input.type === 'password';
    input.type = mostrar ? 'text' : 'password';
    btn.setAttribute('aria-pressed', mostrar);
  });
});
document.querySelectorAll('input[data-cpf]').forEach(function (i) {
  i.addEventListener('input', function () {
    i.value = i.value.replace(/\D/g, '').slice(0, 11);
  });
});
</script>
</body>
</html>
